# docker-compose.yml
version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: nvr-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: localdevpassword
      MONGO_INITDB_DATABASE: nvr_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/nvr_db --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data: