# docker-compose.yml

version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: nvr-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: localdevpassword
      MONGO_INITDB_DATABASE: nvr_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/nvr_db --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    container_name: nvr-auth-service
    environment:
      MONGODB_URI: mongodb://root:localdevpassword@mongodb:27017/nvr_db?authSource=admin
      JWT_SECRET: nvr-jwt-secret-key-2024
      PORT: 3001
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3001:3001"

  api-gateway:
    build: ./api-gateway
    container_name: nvr-api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      JWT_SECRET: nvr-jwt-secret-key-2024
      FRONTEND_URL: http://localhost:8080
      PORT: 3000
    depends_on:
      - auth-service
    ports:
      - "3000:3000" 

volumes:
  mongo_data: