# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Pin v4.2.2 (Exact SHA)
        with:
          fetch-depth: 0

      - name: Copy sonar-project.properties to root
        run: cp devops/sonarqube/sonar-project.properties .

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@cb2da3b4d1a8af962b9d3b51d48c2e646272de35 # Pin v3.1.0 (Exact SHA)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Pin v4.2.2 (Exact SHA)

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@18f2514ee49ffefd60627f6cf554f27574b693bc # Pin v0.36.0 (Exact SHA)
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0

  build-and-scan:
    name: Build & Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, vehicle-service, plate-service, api-gateway, frontend]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Pin v4.2.2 (Exact SHA)

      - name: Build ${{ matrix.service }} image
        run: docker build -t ${{ matrix.service }}:ci ./${{ matrix.service }}/

      - name: Trivy image scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@18f2514ee49ffefd60627f6cf554f27574b693bc # Pin v0.36.0 (Exact SHA)
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0