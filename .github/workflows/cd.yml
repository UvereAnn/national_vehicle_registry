name: CD

on:
  push:
    branches: [main]

env:
  GCP_REGION: us-central1
  ARTIFACT_REPO: nvr-repo

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Pin v4.2.2

      # Updated to use secure keyless login via immutable commit SHAs
      - name: Authenticate to GCP (Keyless)
        uses: google-github-actions/auth@62cf5bd3ea87dd85640343510504874abab29575 # Pin v2.1.7 (Verified Hash)
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e303195312f6628ecb327d3f9f21b13dd62c441c # Pin v2.1.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image tag (short Git SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # ── Build & push each service ──────────────────────────────────

      - name: Build & push auth-service
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/auth-service:${{ env.IMAGE_TAG }} \
            ./auth-service
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/auth-service:${{ env.IMAGE_TAG }}

      - name: Build & push vehicle-service
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/vehicle-service:${{ env.IMAGE_TAG }} \
            ./vehicle-service
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/vehicle-service:${{ env.IMAGE_TAG }}

      - name: Build & push plate-service
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/plate-service:${{ env.IMAGE_TAG }} \
            ./plate-service
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/plate-service:${{ env.IMAGE_TAG }}

      - name: Build & push api-gateway
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api-gateway:${{ env.IMAGE_TAG }} \
            ./api-gateway
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api-gateway:${{ env.IMAGE_TAG }}

      - name: Get api-gateway URL for frontend build
        id: gateway
        run: |
          GATEWAY_URL=$(gcloud run services describe api-gateway \
            --region=${{ env.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=$GATEWAY_URL" >> $GITHUB_OUTPUT

      - name: Build & push frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ steps.gateway.outputs.url }}/api \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ env.IMAGE_TAG }} \
            ./frontend
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ env.IMAGE_TAG }}

      # ── Deploy each service to Cloud Run ──────────────────────────

      - name: Deploy auth-service
        run: |
          gcloud run deploy auth-service \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/auth-service:${{ env.IMAGE_TAG }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --quiet

      - name: Deploy vehicle-service
        run: |
          gcloud run deploy vehicle-service \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/vehicle-service:${{ env.IMAGE_TAG }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --quiet

      - name: Deploy plate-service
        run: |
          gcloud run deploy plate-service \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/plate-service:${{ env.IMAGE_TAG }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --quiet

      - name: Deploy api-gateway
        run: |
          gcloud run deploy api-gateway \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api-gateway:${{ env.IMAGE_TAG }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --quiet

      - name: Deploy frontend
        run: |
          gcloud run deploy frontend \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ env.IMAGE_TAG }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --quiet

      # ── Print live URLs to workflow summary ───────────────────────

      - name: Output deployed URLs
        run: |
          echo "## 🚀 Deployment Complete — $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image tag:** \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          for svc in frontend api-gateway auth-service vehicle-service plate-service; do
            URL=$(gcloud run services describe $svc \
              --region=${{ env.GCP_REGION }} \
              --project=${{ vars.GCP_PROJECT_ID }} \
              --format='value(status.url)')
            echo "| $svc | $URL |" >> $GITHUB_STEP_SUMMARY
          done