# frontend/nginx.conf (Cloud Run version)
# In Cloud Run, the frontend is a static React app only.
# All /api/* calls go from the browser directly to the api-gateway
# Cloud Run URL (baked in as VITE_API_URL at build time).
# Nginx just needs to serve the static files and handle React Router.

server {
    listen PORT_PLACEHOLDER;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}